[package]
name = "my-app-integration"
version = "1.0.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "Integration with My App for VortiDeck"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
vortideck-core = { path = "../../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }

# Add your app-specific dependencies here
# reqwest = { version = "0.12", features = ["json"] }
# windows = { version = "0.58", features = ["Win32_Foundation"] }

[features]
default = []
# Add feature flags as needed 