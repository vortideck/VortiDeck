# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration
#
# Lines starting with "#" are comments.
# Configuration options are organized into tables and keys.
# See documentation for more information on available options.

[changelog]
# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits | unique(attribute="message") %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing s
trim = true
# postprocessors
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" }, # replace repository URL
]
# render body even when there are no releases to process
# render_always = true
# output file path
# output = "test.md"

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = true
# pattern for matching git tags
tag_pattern = "mobile-v.*"
# regex for preprocessing the commit messages
commit_preprocessors = [
  # Replace issue numbers
  #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^mobile-lang|^both-lang|^lang", group = "<!-- 13 -->🌐 Language" },
  { message = "^mobile-feat|^both-feat|^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^mobile-fix|^both-fix|^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^mobile-refactor|^both-refactor|^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^mobile-doc|^both-doc|^docs|^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^mobile-perf|^both-perf|^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^mobile-style|^both-style|^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^mobile-tools|^both-tools|^tools", group = "<!-- 6 -->🔧 Tools" },
  { message = "^mobile-test|^both-test|^test", group = "<!-- 7 -->🧪 Testing" },
  { message = "^mobile-todo|^both-todo|^todo", group = "<!-- 8 -->📝 Todo" },
  { message = "^mobile-chore\\(release\\): prepare for|^both-chore\\(release\\): prepare for", skip = true },
  { message = "^mobile-chore\\(deps.*\\)|^both-chore\\(deps.*\\)", skip = true },
  { message = "^mobile-chore\\(pr\\)|^both-chore\\(pr\\)", skip = true },
  { message = "^mobile-chore\\(pull\\)|^both-chore\\(pull\\)", skip = true },
  { message = "^mobile-chore|^both-chore|^chore|^ci", group = "<!-- 9 -->⚙️ Miscellaneous Tasks" },
  { message = "^mobile-security|^both-security|^security", group = "<!-- 10 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 11 -->◀️ Revert" },
  # This should be the last rule to catch any remaining mobile/both commits
  { message = "^mobile-.*|^both-.*", group = "<!-- 12 -->💼 Other" },
]
# filter out the commits that are not matched by commit parsers
filter_commits = false
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"