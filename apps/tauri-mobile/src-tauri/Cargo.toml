[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[package]
name = "VortiDeck"
version = "0.1.0"
description = "VortiDeck mobile companion app"
authors = ["Alexi Pawelec"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0.226", features = ["derive"] }
log = "0.4.28"
tauri = { version = "2.12.5", features = ["devtools"] }



tauri-plugin-log = "2.10.1"
mdns-sd = "0.12.0"
tokio = { version = "1.42.0", features = ["full"] }
mdns = "3.0.0"
futures-util = "0.3.31"
local-ip-address = "0.6.3"
tauri-plugin-haptics = "2.4.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-keep-screen-on = "0.1.4"
android-wakelock = "0.1.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-biometry = "0.2"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-http = "2.8.3"
tauri-plugin-shell = "2.6.0"



[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[patch.crates-io]
# AGP 9 compatibility; see patches/tauri-plugin-keep-screen-on/VORTIDECK_PATCH.md
tauri-plugin-keep-screen-on = { path = "patches/tauri-plugin-keep-screen-on" }
