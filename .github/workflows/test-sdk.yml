name: Test Plugin SDK

on:
  push:
    branches: [main, feature/plugin-overhaul]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]

    env:
      # Source checkouts download the pinned extism-js and binaryen releases on first build.
      VORTIDECK_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain

    steps:
      - uses: actions/checkout@v4

      # The SDK and the example are pnpm workspace packages (the example depends on
      # "@vortideck/plugin-sdk": "workspace:*"), so npm cannot install them.
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache the plugin toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: vortideck-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/plugin-sdk/bin/fetch-toolchain.js') }}

      - name: Install SDK and example dependencies
        run: pnpm install --frozen-lockfile --filter "@vortideck/plugin-sdk..." --filter "example-plugin-with-sdk..."

      - name: Build the SDK
        run: pnpm --filter @vortideck/plugin-sdk run build

      - name: Build example plugin
        run: pnpm --filter example-plugin-with-sdk run build

      - name: Verify WASM output
        shell: bash
        run: ls -lh examples/plugin-with-sdk/dist/*.wasm
